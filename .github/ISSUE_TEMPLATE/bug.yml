name: Bug report
description: Report a reproducible public plugin or documentation problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private security reports, tenant data, or work-owned source material. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Plugin version or site
      placeholder: "For example: 1.2.1 (or site only)"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Claude Desktop Chat, Claude Desktop Cowork, Claude Code, Design suite website, Documentation]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce with made-up content
      description: Use synthetic content and include the expected and observed result.
    validations:
      required: true
