name: deploy design atlas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Reviewed release to publish
        required: true
        type: choice
        default: v1.6.0
        options: [v1.6.0]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public plugin surface
    outputs:
      publication_sha: ${{ steps.publication.outputs.sha }}
    runs-on: [self-hosted, linux, x64, jarvis-pr-ephemeral]
    steps:
      - name: Checkout public artifact
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Scan authored commits, not GitHub's temporary merge identity.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.pull_request.head.sha || github.sha }}
      - name: Bind the reviewed publication commit
        id: publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          publication_sha="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            test "$RELEASE_TAG" = v1.6.0
            test "$publication_sha" = baa93092cd5a0298e1050029556780c6f2711ba9
          fi
          printf 'sha=%s\n' "$publication_sha" >> "$GITHUB_OUTPUT"
      - name: Verify new publication identities
        env:
          METADATA_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$METADATA_BASE" && "$METADATA_BASE" != 0000000000000000000000000000000000000000 ]]; then
            python3 scripts/check_commit_metadata.py --base "$METADATA_BASE"
          else
            python3 scripts/check_commit_metadata.py
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate marketplace and plugin boundary
        run: |
          python -m unittest discover -s tests -v
          python scripts/package_plugin.py --output "$RUNNER_TEMP/collibra-design-suite.zip"
  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public artifact
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.publication_sha }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
