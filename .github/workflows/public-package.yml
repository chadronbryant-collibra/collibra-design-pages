name: validate public package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source and negative-boundary tests
    runs-on: [self-hosted, linux, x64, jarvis-pr-ephemeral]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  package:
    name: Deterministic portable package
    needs: source
    runs-on: [self-hosted, linux, x64, jarvis-pr-ephemeral]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build twice and require local parity
        shell: bash
        run: |
          python scripts/package_plugin.py --output first.zip
          python scripts/package_plugin.py --output second.zip
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          one = hashlib.sha256(Path("first.zip").read_bytes()).hexdigest()
          two = hashlib.sha256(Path("second.zip").read_bytes()).hexdigest()
          if one != two:
              raise SystemExit(f"same-OS builds differ: {one} != {two}")
          Path("digest-linux.txt").write_text(one + "\n", encoding="utf-8", newline="\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: |
            first.zip
            digest-linux.txt

  compare:
    name: Verify deterministic package digest
    needs: package
    runs-on: [self-hosted, linux, x64, jarvis-pr-ephemeral]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
      - name: Require one verified digest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(Path("packages").glob("*/digest-*.txt"))
          digests = {path.read_text(encoding="utf-8").strip() for path in files}
          if len(files) != 1 or len(digests) != 1:
              raise SystemExit(f"expected one verified digest, got {files=} {digests=}")
          print("verified deterministic digest:", digests.pop())
          PY
