<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic recovery flow</title>
<style>:root{--navy:#002B40;--forest:#03755F;--ink:#4B4B4B;--cloud:#F0F2F3;--white:#FFFFFF}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--cloud)}main{max-width:48rem;margin:auto;padding:2rem}section{background:var(--white);border-top:8px solid var(--forest);border-radius:4px;padding:1.5rem}h1{color:var(--navy)}button{font:inherit;font-weight:700;color:var(--white);background:var(--navy);border:2px solid var(--navy);border-radius:4px;padding:.7rem 1rem}button:hover{background:var(--forest);border-color:var(--forest)}:focus-visible{outline:3px solid var(--navy);outline-offset:3px}@media (max-width:42rem){main{padding:1rem}section{padding:1rem}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}</style></head>
<body><main><section aria-labelledby="error-title"><p><strong>Synthetic example · proposed interaction</strong></p><h1 id="error-title">We could not save your definition</h1><p>Your text is still here. Check your connection, then try again. If the problem continues, copy the text before leaving this page.</p><button type="button" id="retry">Try again</button><p id="result" role="status" aria-live="polite"></p></section></main><script>const b=document.getElementById('retry'),r=document.getElementById('result');b.addEventListener('click',()=>{r.textContent='Synthetic result: the definition is ready for review.';b.disabled=true;});</script></body></html>
